name: C/C++ CI

on:
  push:
    branches: [ vlm_master ]
  pull_request:
    branches: [ vlm_master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: preconf
      run: autoreconf -ivf
    - name: configure
      run: ./configure
    - name: make
      run: make -j
    - name: make check
      run: make -j check
    - name: make distcheck
      run: make -j distcheck
